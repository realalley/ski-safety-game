<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>滑雪安全避障</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 游戏画布：底层渲染层 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 层：开始界面 -->
    <div id="startScreen" class="screen">
        <div class="screen-inner">
            <h1 class="title">滑雪安全避障</h1>
            <p class="subtitle">了解单板双板轨迹 · 提升安全意识</p>

            <div class="level-select">
                <p class="select-label">选择雪道难度</p>
                <div class="level-cards">
                    <button class="level-card" data-level="green">
                        <span class="level-dot" style="background:#43a047"></span>
                        <span class="level-name">绿道</span>
                        <span class="level-diff">初级</span>
                        <span class="level-stars" data-stars-for="green"></span>
                        <span class="level-lock hidden">🔒</span>
                    </button>
                    <button class="level-card" data-level="blue">
                        <span class="level-dot" style="background:#1e88e5"></span>
                        <span class="level-name">蓝道</span>
                        <span class="level-diff">中级</span>
                        <span class="level-stars" data-stars-for="blue"></span>
                        <span class="level-lock hidden">🔒</span>
                    </button>
                    <button class="level-card" data-level="red">
                        <span class="level-dot" style="background:#e53935"></span>
                        <span class="level-name">红道</span>
                        <span class="level-diff">高级</span>
                        <span class="level-stars" data-stars-for="red"></span>
                        <span class="level-lock hidden">🔒</span>
                    </button>
                    <button class="level-card" data-level="black">
                        <span class="level-dot" style="background:#212121"></span>
                        <span class="level-name">黑道</span>
                        <span class="level-diff">专家</span>
                        <span class="level-stars" data-stars-for="black"></span>
                        <span class="level-lock hidden">🔒</span>
                    </button>
                </div>
            </div>

            <div class="board-select">
                <p class="select-label">选择滑雪板类型</p>
                <div class="board-options">
                    <button class="board-btn active" data-board="ski">
                        <span class="board-icon">⛷️</span>
                        <span class="board-name">双板</span>
                        <span class="board-desc">直线滑行 · 制动稳定</span>
                    </button>
                    <button class="board-btn" data-board="snowboard">
                        <span class="board-icon">🏂</span>
                        <span class="board-name">单板</span>
                        <span class="board-desc">S型轨迹 · 转向灵活</span>
                    </button>
                </div>
            </div>

            <div class="board-select">
                <p class="select-label">选择操控方式</p>
                <div class="board-options">
                    <button class="board-btn active" data-control="touch">
                        <span class="board-icon">👆</span>
                        <span class="board-name">触屏</span>
                        <span class="board-desc">滑动屏幕控制方向</span>
                    </button>
                    <button class="board-btn" data-control="tilt">
                        <span class="board-icon">📱</span>
                        <span class="board-name">重力感应</span>
                        <span class="board-desc">左右倾斜转向，前后倾斜控速</span>
                    </button>
                </div>
            </div>

            <button id="startBtn" class="primary-btn">开始滑行</button>

            <div class="tips">
                <p>📱 左右滑动屏幕控制转向</p>
                <p>⬇️ 下滑或按住减速</p>
                <p>📳 重力感应：左右倾斜转向，前倾加速、后仰减速</p>
            </div>
        </div>
    </div>

    <!-- HUD 层：游戏中信息 -->
    <div id="hud" class="hud hidden">
        <div class="hud-top">
            <div class="hud-item">
                <span class="hud-label">速度</span>
                <span id="speedValue" class="hud-value">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">雪道</span>
                <span id="levelNameValue" class="hud-value">-</span>
            </div>
            <div class="hud-item hud-distance">
                <span class="hud-label">距离</span>
                <span id="distanceValue" class="hud-value">0/600m</span>
                <div class="distance-bar-bg"><div id="distanceBar" class="distance-bar"></div></div>
            </div>
        </div>
        <button id="skipReplayBtn" class="skip-replay-btn hidden">跳过回放 ⏭</button>
        <button id="pauseBtn" class="pause-btn">⏸</button>
    </div>

    <!-- 暂停界面 -->
    <div id="pauseScreen" class="screen hidden">
        <div class="screen-inner">
            <h2 class="title">已暂停</h2>
            <button id="resumeBtn" class="primary-btn">继续滑行</button>
            <button id="restartBtn" class="secondary-btn">重新开始</button>
        </div>
    </div>

    <!-- 事故回放结果界面 -->
    <div id="replayScreen" class="screen hidden">
        <div class="screen-inner">
            <h2 class="title">事故分析</h2>
            <div id="replayFault" class="fault-badge"></div>
            <div id="replayRule" class="rule-card"></div>
            <div id="replayAdvice" class="advice-card"></div>
            <button id="continueBtn" class="primary-btn">继续滑行</button>
            <button id="replayRestartBtn" class="secondary-btn">重新开始</button>
        </div>
    </div>

    <!-- 关卡结算界面 -->
    <div id="settlementScreen" class="screen hidden">
        <div class="screen-inner">
            <h2 id="settlementTitle" class="title">关卡完成</h2>
            <div id="settlementStars" class="settlement-stars"></div>
            <div id="settlementStats" class="stat-grid"></div>
            <button id="settlementNextBtn" class="primary-btn">挑战下一关</button>
            <button id="settlementReplayBtn" class="secondary-btn">重新挑战</button>
            <button id="settlementMenuBtn" class="secondary-btn">返回选关</button>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/progression.js"></script>
    <script src="js/score.js"></script>
    <script src="js/player.js"></script>
    <script src="js/trail.js"></script>
    <script src="js/slope.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/aimanager.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/replay.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
