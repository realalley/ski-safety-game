edition: 1.0.0
name: xq-api
access: default
vars:
  region: cn-hangzhou
  service: xq
  function: api

services:
  xq-api:
    component: fc
    props:
      region: ${vars.region}
      service:
        name: ${vars.service}
        description: 中国象棋在线对战 API
      function:
        name: ${vars.function}
        description: 中国象棋在线对战 API
        runtime: nodejs16
        codeUri: ./
        handler: index.handler
        memorySize: 256
        timeout: 30
        environmentVariables:
          OTS_ENDPOINT: https://wuziqi.cn-hangzhou.ots.aliyuncs.com
          OTS_INSTANCE: wuziqi
          OTS_TABLE_NAME: xq_room
          OTS_AK_ID: ${env.OTS_AK_ID}
          OTS_AK_SECRET: ${env.OTS_AK_SECRET}
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - GET
              - POST
              - OPTIONS
